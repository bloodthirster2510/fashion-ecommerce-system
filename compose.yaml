name: fashion-ecommerce

services:
  image-validation:
    build:
      context: ./ai_services/image-validation
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${IMAGE_VALIDATION_PORT:-7001}:7001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  garment-processing:
    build:
      context: ./ai_services/garment-processing
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${GARMENT_PROCESSING_PORT:-7002}:7002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7002/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGINS: "${DOCKER_FRONTEND_URL:-http://localhost:8080},${DOCKER_FRONTEND_URL_ALT:-http://127.0.0.1:8080}"
      FRONTEND_URL: "${DOCKER_FRONTEND_URL:-http://localhost:8080}"
      ADMIN_FRONTEND_URL: "${DOCKER_FRONTEND_URL:-http://localhost:8080}"
      CUSTOMER_FRONTEND_URL: "${DOCKER_FRONTEND_URL:-http://localhost:8080}"
      PUBLIC_API_BASE_URL: "${DOCKER_PUBLIC_API_BASE_URL:-http://localhost:5000}"
      IMAGE_VALIDATION_PROVIDER: custom_model
      IMAGE_VALIDATION_CUSTOM_MODEL_URL: http://image-validation:7001/validate-image
      IMAGE_VALIDATION_CUSTOM_MODEL_HEALTH_URL: http://image-validation:7001/health
      VIRTUAL_TRY_ON_GARMENT_PROCESSING_ENABLED: "true"
      VIRTUAL_TRY_ON_GARMENT_PROCESSING_URL: http://garment-processing:7002/prepare-collage
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      image-validation:
        condition: service_healthy
      garment-processing:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 20s

  web:
    build:
      context: ./web_frontend
      args:
        VITE_API_BASE_URL: "${DOCKER_API_BASE_URL:-http://localhost:5000/api}"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  backend_uploads:
